name: full tests

# Optional pytest, toy example, and extra examples.
# Runs on push to main, on a published release, and on demand.
# A pull request to main runs only the phage10-solve job here (and required-tests.yml).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: full-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          auto-update-conda: true
          conda-remove-defaults: true
          activate-environment: metametro
          environment-file: environment.yml
      - name: Install the console script
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: All pytest (mandatory and optional)
        timeout-minutes: 30
        run: pytest --tb=short
      - name: Build in-process benchmarks
        timeout-minutes: 20
        run: metametro benchbuild --all
      - name: Load every benchbuild output
        timeout-minutes: 20
        run: python -c "from metametro.bench.check import check_registry; print(check_registry())"
      - name: Toy example
        timeout-minutes: 15
        run: python examples/toy/run.py
      - name: Extra examples
        timeout-minutes: 60
        run: |
          set -euo pipefail
          shopt -s nullglob
          for s in examples/*/run.py examples/*/pipeline.sh; do
            case "$s" in
              examples/toy/run.py) continue ;;
            esac
            if [[ "$s" == *.py ]]; then python "$s"; else bash "$s"; fi
          done

  # Build phage_10 from the pinned genomes, check its identity against
  # canonical_identity("phage_10"), and solve it with metaMalevich at a pinned
  # commit. metaMalevich's exit code and ok flag are not trusted (#275); the
  # phage_10 row must say build_status built and solved true.
  phage10-solve:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      METAMALEVICH_COMMIT: 8d80168696ed4321eadb39a45e072ceeb4076fd9
      SAMOVAR_COMMIT: d6bb8246f9e31c7890f4393aa92bc7e0aa53d593
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.12"
          auto-update-conda: true
          conda-remove-defaults: true
          activate-environment: metametro
          environment-file: environment.yml
      - name: Install MetaMetro, MEGAHIT, and metaMalevich's own dependencies
        run: |
          conda install -y -n metametro -c conda-forge -c bioconda megahit=1.2.9 pandas=3.0.6 altair=6.2.2
          python -m pip install --no-deps --no-build-isolation -e .
          command -v megahit megahit_toolkit
      - name: Install Samovar (read simulator) at a pinned commit
        run: |
          git clone https://github.com/ctlab/samovar.git "$RUNNER_TEMP/samovar"
          git -C "$RUNNER_TEMP/samovar" checkout "$SAMOVAR_COMMIT"
          conda env create -n samovar -f "$RUNNER_TEMP/samovar/environment.yml"
          (cd "$RUNNER_TEMP/samovar" && conda run -n samovar ./install.sh)
          echo "$RUNNER_TEMP/samovar/bin" >> "$GITHUB_PATH"
      - name: Fetch the pinned phage genomes
        timeout-minutes: 15
        run: metametro benchfetch phage_10
      - name: Default build and canonical identity
        timeout-minutes: 30
        run: |
          samovar --version
          metametro benchbuild phage_10 --outdir "$RUNNER_TEMP/phage_10"
          python scripts/check_phage10_solve.py identity "$RUNNER_TEMP/phage_10"
      - name: Check out metaMalevich at the pinned commit
        run: |
          git clone https://github.com/dsmutin/metaMalevich.git "$RUNNER_TEMP/metaMalevich"
          git -C "$RUNNER_TEMP/metaMalevich" checkout "$METAMALEVICH_COMMIT"
          # --no-deps: metaMalevich pins metametro==0.24.0, which is not on PyPI and
          # is not the version under test; its other dependencies are installed above.
          python -m pip install --no-deps --no-build-isolation -e "$RUNNER_TEMP/metaMalevich"
      - name: metaMalevich solve on phage_10
        timeout-minutes: 30
        run: |
          set +e
          metamalevich solve --bench phage_10 --execute --workdir "$RUNNER_TEMP/solve" -o "$RUNNER_TEMP/solve.json"
          echo "metamalevich solve exited $? (not used)"
          set -e
          python scripts/check_phage10_solve.py solve "$RUNNER_TEMP/solve.json" "$RUNNER_TEMP/solve"
